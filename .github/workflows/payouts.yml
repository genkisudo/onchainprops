# Daily: fetch onchain payout stats (payouts.js → payouts.json) with the
# ETHERSCAN_API_KEY repo secret, regenerate the firm pages, commit the result.
# Triggers are schedule + manual only: never pull_request, so fork PRs can
# never run with the secret.
name: Refresh onchain payout stats

on:
  schedule:
    - cron: '30 6 * * *'  # Daily at 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: payouts
  cancel-in-progress: false

jobs:
  payouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch payout stats from Etherscan
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: node payouts.js

      - name: Regenerate site content
        run: node build.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp payouts.json "$RUNNER_TEMP/payouts.json"
          # main may move during the run (another workflow or push). Everything committed
          # here is generated, so instead of merging: take the latest main, put this run's
          # payouts.json on top, rebuild, and push. Retry if main moves again.
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/payouts.json" payouts.json
            node build.js
            # Stage before the quiet check so a new untracked {key}.txt is committed.
            # This job does not ping IndexNow.
            key=$(tr -d '[:space:]' < _indexnow/key.txt)
            git add payouts.json index.html script.js llms.txt sitemap.xml firms blog.html blog "${key}.txt"
            if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
            git commit -q -m "chore: refresh onchain payout stats [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
