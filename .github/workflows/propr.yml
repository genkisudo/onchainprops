# Daily: fetch Propr's public stats (propr.js → propr.json) and
# regenerate the Propr firm page that shows the last 30 days. No API key:
# the endpoints are public, but the site's CSP stops the browser calling it, so
# it is fetched here and rendered into static HTML.
# Triggers are schedule + manual only: never pull_request.
name: Refresh Propr stats

on:
  schedule:
    - cron: '45 6 * * *'  # Daily at 06:45 UTC (after the UTC day has closed; offset from the other refresh jobs)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: propr
  cancel-in-progress: false

jobs:
  propr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Propr stats
        run: node propr.js

      - name: Regenerate site content
        run: node build.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp propr.json "$RUNNER_TEMP/propr.json"
          # main may move during the run. Everything committed here is generated, so
          # take the latest main, put this run's propr.json on top, rebuild, push.
          # propr.js keeps the previous file when the API is down, so a failed
          # fetch leaves this copy unchanged and the commit step finds nothing to push.
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/propr.json" propr.json
            node build.js
            if git diff --quiet; then echo "Nothing changed."; exit 0; fi
            git add propr.json compare.html index.html script.js llms.txt llms-full.txt sitemap.xml feed.xml firms blog.html blog
            git commit -q -m "chore: refresh Propr stats [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
