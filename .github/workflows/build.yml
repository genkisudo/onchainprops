# Regenerates derived site content (index.html blocks, script.js firm data,
# llms.txt, llms-full.txt, sitemap, blog, firm page stats/descriptions, compare-card links,
# discount-codes.html) from firms.json +
# faq.json + posts/*.md on every push to main, and commits
# the result back. GitHub Pages then redeploys from the updated branch.
#
# Loop protection: the job skips runs triggered by the bot's own commit,
# and the commit message carries [skip ci] as a second guard.
name: Regenerate from firms.json

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate generated content
        run: node build.js

      - name: Commit regenerated files if changed
        run: |
          # Stage before the quiet check so a new untracked {key}.txt is committed.
          # This job does not ping IndexNow.
          key=$(tr -d '[:space:]' < _indexnow/key.txt)
          git add index.html compare.html discount-codes.html script.js llms.txt llms-full.txt sitemap.xml feed.xml firms blog.html blog "${key}.txt"
          if git diff --cached --quiet; then
            echo "Generated content already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate site content from firms.json [skip ci]"
            git push
          fi
