# CodeRabbit review config. Schema: https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit also reads CLAUDE.md automatically as the project's coding guidelines.
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main]

  # Fully generated files: build.js owns them and pr-check.yml fails the PR if
  # they drift from the data, so reviewing them line by line is noise.
  path_filters:
    - "!llms.txt"
    - "!llms-full.txt"
    - "!feed.xml"
    - "!sitemap.xml"
    - "!blog/*.html"
    - "!hypernova.json"
    - "!propr.json"
    - "!payouts.json"
    - "!balance.json"
    - "!buyback.json"
    - "!amplitude.min.js"
    - "!package-lock.json"

  path_instructions:
    - path: "firms.json"
      instructions: |
        This is the single source of truth for every firm fact on the site.
        - For each changed fact (profit split, account size, chain, leverage, token, country,
          payout speed, URLs), check that compare.html, the firm's firms/<slug>.html review
          prose and its hand-written <title>, and README.md say the same thing. Flag any mismatch.
        - If a firm's terms changed, its lastVerified (YYYY-MM-DD) should also be updated.
        - pageHook must not contain profit splits or account sizes (the build appends those).
        - A new firm needs lastVerified, pageHook and a matching firms/<slug>.html page.
        - Flag claims that look unverifiable or promotional (guaranteed payout times,
          unverified payout totals, a country with no source). Prefer omitting over guessing.
    - path: "firms/*.html"
      instructions: |
        Firm review pages mix generated and hand-written content.
        - Content between <!-- GEN:BEGIN key --> and <!-- GEN:END key --> is generated by
          build.js and must never be hand-edited. A page must contain all four marker pairs:
          firm-stats, firm-breadcrumb, firm-description, firm-og-description.
        - Any % or $ figure in <title>, the review prose or the FAQ JSON-LD must match the
          firm's firms.json entry.
        - propr.html and hypernova.html: live figures (lifetime payouts, payout totals, payout
          times, trader counts) must come from their GEN blocks, never typed into the prose.
        - Flag unverifiable claims, superlatives presented as fact, and anything that reads as
          financial advice. Check FAQ JSON-LD answers agree with the visible FAQ text.
    - path: "compare.html"
      instructions: |
        The article prose is hand-maintained and must agree with firms.json (splits, account
        sizes, chains, payout speed). The hypernova-lifetime marker is generated; do not hand-edit it.
    - path: "index.html"
      instructions: |
        Everything inside GEN markers is generated from firms.json/faq.json. Only review the
        hand-written shell; flag any edits inside GEN blocks.
    - path: "posts/*.md"
      instructions: |
        Blog sources (rendered by build.js). Check frontmatter is complete like posts/_template.md,
        that firm facts match firms.json, and that claims are sourced or clearly hedged.
    - path: "*.js"
      instructions: |
        Vanilla ES2022, zero dependencies. For the fetcher scripts (hypernova.js, propr.js,
        payouts.js, balance.js, buyback.js): on any API failure they must keep the last good
        JSON file rather than write partial or empty data. In build.js, watch for HTML
        injection (escape data before inserting it into HTML) and non-deterministic output.
    - path: ".github/workflows/*.yml"
      instructions: |
        Workflows that commit to main must keep loop protection (skip when the actor is
        github-actions[bot], and [skip ci] in the commit message). Use least-privilege permissions.
